<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa - Absensi Jama'ah SMK Negeri 1 Sangasanga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <i class="bi bi-person-badge-fill"></i>
            </div>
            <h5>Absensi SMK N 1 Sangasanga</h5>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item">
                <a href="dashboard.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
            </li>
            <li class="menu-item active">
                <a href="students.html"><i class="bi bi-people-fill"></i><span>Data Siswa</span></a>
            </li>
            <li class="menu-item">
                <a href="import.html"><i class="bi bi-file-earmark-excel-fill"></i><span>Import Excel</span></a>
            </li>
            <li class="menu-item">
                <a href="scan-qr.html"><i class="bi bi-upc-scan"></i><span>Scan QR</span></a>
            </li>
            <li class="menu-item">
                <a href="attendance.html"><i class="bi bi-clipboard-check-fill"></i><span>Data Absensi</span></a>
            </li>
            <li class="menu-item">
                <a href="reports.html"><i class="bi bi-file-earmark-text-fill"></i><span>Laporan</span></a>
            </li>
            <li class="menu-item">
                <a href="settings.html"><i class="bi bi-gear-fill"></i><span>Setting</span></a>
            </li>
            <li class="menu-item">
                <a href="admin.html"><i class="bi bi-person-gear"></i><span>Admin</span></a>
            </li>
            <li class="menu-item">
                <a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-header">
            <div class="header-left">
                <button class="btn-toggle-sidebar" id="toggleSidebar"><i class="bi bi-list"></i></button>
                <div class="header-title"><h4>Data Siswa</h4></div>
            </div>
        </header>

        <div class="container-fluid">
            <div class="card premium-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="card-title mb-0">Daftar Siswa</h5>
                        <div class="gap-2">
                            <button class="btn btn-primary" id="btnAddStudent">
                                <i class="bi bi-plus-circle"></i> Tambah Siswa
                            </button>
                            <button class="btn btn-info" id="btnPrintQR">
                                <i class="bi bi-printer"></i> Cetak QR
                            </button>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="searchInput" placeholder="Cari siswa...">
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th style="width: 5%;">No</th>
                                    <th>Nama</th>
                                    <th>NISN</th>
                                    <th>Tingkat</th>
                                    <th>Jurusan</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="studentTable">
                                <tr><td colspan="7" class="text-center">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <nav id="pagination"></nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Cetak QR -->
    <div class="modal fade" id="printQRModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cetak QR Code</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="printQRForm">
                        <div class="mb-3">
                            <label class="form-label">Pilihan Cetak:</label>
                            <div>
                                <input type="radio" id="printAll" name="printType" value="all" checked>
                                <label for="printAll" style="display: inline; margin-right: 30px;">Cetak Semua Siswa</label>
                                <input type="radio" id="printFilter" name="printType" value="filter">
                                <label for="printFilter" style="display: inline;">Cetak Berdasarkan Tingkat & Jurusan</label>
                            </div>
                        </div>
                        
                        <div id="filterOptions" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label">Tingkat *</label>
                                <select class="form-select" id="filterTingkat">
                                    <option value="">Pilih Tingkat</option>
                                    <option value="X">X</option>
                                    <option value="XI">XI</option>
                                    <option value="XII">XII</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Jurusan *</label>
                                <select class="form-select" id="filterJurusan">
                                    <option value="">Pilih Jurusan</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Format:</label>
                            <div>
                                <input type="radio" id="formatPrint" name="format" value="print" checked>
                                <label for="formatPrint" style="display: inline; margin-right: 30px;">Print Langsung</label>
                                <input type="radio" id="formatPDF" name="format" value="pdf">
                                <label for="formatPDF" style="display: inline;">Download PDF</label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="btnCetakQR">
                        <i class="bi bi-printer"></i> Cetak
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal QR Code -->
    <div class="modal fade" id="qrModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">QR Code Siswa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="mb-3">
                        <h6 id="qrStudentName" class="fw-bold"></h6>
                        <p class="text-muted mb-1">NISN: <span id="qrStudentNISN"></span></p>
                        <p class="text-muted">Kelas: <span id="qrStudentClass"></span></p>
                    </div>
                    <div id="qrcodeContainer" class="d-flex justify-content-center mb-3"></div>
                    <div class="d-flex gap-2 justify-content-center">
                        <button class="btn btn-primary" onclick="downloadQR()">
                            <i class="bi bi-download"></i> Download QR
                        </button>
                        <button class="btn btn-secondary" onclick="printQR()">
                            <i class="bi bi-printer"></i> Print
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Add/Edit Student -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah Siswa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">NISN *</label>
                                <input type="text" class="form-control" id="nisn" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nama Lengkap *</label>
                                <input type="text" class="form-control" id="nama" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Jenis Kelamin *</label>
                                <select class="form-select" id="jenisKelamin" required>
                                    <option value="">Pilih...</option>
                                    <option value="Laki-laki">Laki-laki</option>
                                    <option value="Perempuan">Perempuan</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Kelas</label>
                                <input type="text" class="form-control" id="kelas" placeholder="Contoh: VII-A">
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Alamat</label>
                                <textarea class="form-control" id="alamat" rows="2"></textarea>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">No HP</label>
                                <input type="text" class="form-control" id="noHp" placeholder="08xx">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status *</label>
                                <select class="form-select" id="status" required>
                                    <option value="Aktif">Aktif</option>
                                    <option value="Tidak Aktif">Tidak Aktif</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-primary">Simpan</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="assets/js/firebase.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/students.js"></script>
</body>
</html>
